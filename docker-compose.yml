services:
  booking:
    build: .
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      BASE_URL: ${BASE_URL:?Set the public HTTPS booking URL}
      DATABASE_PATH: /app/data/booking.sqlite
      OWNER_ID: ${OWNER_ID:-owner-local}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set a random operator token of at least 24 characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a random 64-character hex encryption key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://booking.example.com/oauth/google/callback}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-120}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-300}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-10000}
      RECONCILE_MIN_AGE_MS: ${RECONCILE_MIN_AGE_MS:-60000}
      HAI_CONNECTOR_TOKEN: ${HAI_CONNECTOR_TOKEN:-}
      HAI_CONNECTOR_PROJECT_KEY: ${HAI_CONNECTOR_PROJECT_KEY:-016-Google-Agenda}
      HAI_CONNECTOR_MAX_ITEMS: ${HAI_CONNECTOR_MAX_ITEMS:-100}
      HAI_CONNECTOR_INCLUDE_PII: ${HAI_CONNECTOR_INCLUDE_PII:-false}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - booking-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  booking-data:
